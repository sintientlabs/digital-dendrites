# Sandbox-only nginx config for serving the static site from the bind-mounted repo.
# Kept out of the app's deployment configs (netlify.toml / vercel.json untouched).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't expose repository metadata (.git, .base44, dotfiles) over the preview URL.
    location ~ /\. {
        deny all;
    }

    # The dev server must never let the browser cache a stale page.
    add_header Cache-Control "no-store";

    location / {
        try_files $uri $uri/ =404;
    }
}
